spring.application.name=ninjas-

# URL do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ninjas

# Usuário do PostgreSQL
spring.datasource.username=postgres

# Senha do PostgreSQL
spring.datasource.password=123456

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra as consultas SQL no console
spring.jpa.show-sql=true

# Formata o SQL para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# CONFIGURAÇÕES DO SERVIDOR
# ==========================================

# Porta em que a aplicação será executada
server.port=8080